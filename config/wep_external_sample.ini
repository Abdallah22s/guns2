[source]
  friendly_name = external_sample
  building = External Sample
  video_type = mp4
  video_link = /home/computer-vision/Desktop/repo/pro-2/OpenThreatDetection/videos/external_samples/one-by-one-person-detection.mp4
  stream_read_duration = 7200

[log]
  log_config_file = ../config/weplog_test_camera.conf

[processor]
  knife_threshold = 0.7
  output_path = inferences/
  bad_frame_skip_size = 10
  frame_skip_size = 1

[inference]
  # framework: tf = YOLOv4 (TensorFlow) | yolov8 = YOLOv8 (Ultralytics)
  framework = tf
  weights_weapon = weaponresource/checkpoints_weapon/WeaponOct7_608_6000/
  input_size_weapon = 608
  tiny = False
  model = yolov4
  # لاستخدام YOLOv8 غيّر إلى: framework = yolov8 و weights_weapon = yolov8n.pt أو مسار نموذج أسلحة .pt
  # output_format = XVID
  # for webm
  output_format = vp80
  iou_weapon = 0.5
  score_weapon = 0.3
  crop_rate = 150

[restful]
  enable = True
  url = http://localhost:5001/consumeevent

[mqtt]
  enable = False
  broker = localhost
  topic = /wep/results
  user = none
  password = none

[raptor]
  enable = True
  url_token = https://staginglogin.raptortech.com/oauth/token
  url_building = https://api-stag.raptortech.com/clientbuilding/v1/Buildings
  url_template = https://api-stag.raptortech.com/incidents/v1/IncidentTemplate
  url_incident = https://api-stag.raptortech.com/incidents/v1/Incident/Create
  client_id = 
  client_secret = 
  audience = https://api-stag.raptortech.com
  grant_type = client_credentials
  client_token = 
  buildingUID = 
  templateUID = 
  templateName = Lockdown
  lat = 29.806123
  long = -95.409467
  additionalData = Initiated by partner Iterate
  isDrill = false
