[source]
  friendly_name = adsda
  building = dsad
  video_type = HLS
  video_link = rtsp://10.10.10.02
  stream_read_duration = 7200

[log]
  log_config_file = ../config/weplog_adsda.conf

[processor]
  knife_threshold = 0.7
  output_path = inferences/
  bad_frame_skip_size = 10
  frame_skip_size = 100

[inference]
  framework = yolov8
  weights_weapon = yolov8n.pt
  input_size_weapon = 608
  tiny = False
  model = yolov8n
  # output_format = XVID
  # for webm
  output_format = vp80
  iou_weapon = 0.5
  score_weapon = 0.3
  crop_rate = 150

[restful]
  enable = True
  url = http://localhost:5001/consumeevent

[mqtt]
  enable = False
  broker = localhost
  topic = /wep/results
  user = none
  password = none

[raptor]
  enable = True
  url_token = https://staginglogin.raptortech.com/oauth/token
  url_building = https://api-stag.raptortech.com/clientbuilding/v1/Buildings
  url_template = https://api-stag.raptortech.com/incidents/v1/IncidentTemplate
  url_incident = https://api-stag.raptortech.com/incidents/v1/Incident/Create
  client_id = 
  client_secret = 
  audience = https://api-stag.raptortech.com
  grant_type = client_credentials
  client_token = 
  buildingUID = 
  templateUID = 
  templateName = Lockdown
  lat = 29.806123
  long = -95.409467
  additionalData = Initiated by partner Iterate
  isDrill = false
